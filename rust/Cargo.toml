[package]
name = "fun_macos_core"
version = "0.1.0"
edition = "2024"
description = "Native macOS GUI core for Fun coding agent"

[lib]
name = "fun_macos_core"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

[features]
uniffi-bindgen = ["uniffi/cli"]

[dependencies]
fun-core = { git = "https://github.com/swimming-bookstore/fun-coding-agent" }
provider-grok = { git = "https://github.com/swimming-bookstore/fun-coding-agent" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = "0.32"

[profile.release]
lto = true
strip = true
